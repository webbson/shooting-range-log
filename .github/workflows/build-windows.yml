name: build-windows

# Proves the tightest constraint first: a Windows installer can be produced.
# macOS cannot practically cross-build Tauri (WebView2 + WiX/NSIS need Windows),
# so a Windows runner is the real build target. Code signing + the auto-updater
# manifest are deferred to M7 — this job just proves the installer builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app (msi + nsis)
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
