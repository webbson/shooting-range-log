[package]
name = "shooting-range-log"
version = "0.1.0"
description = "Shooting range weapon & member management"
authors = ["Aura Group"]
edition = "2021"
default-run = "shooting-range-log"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shooting_range_log_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
calamine = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.18"
dirs = "6"
rust-s3 = "0.37.2"
# Pinned to the exact reqwest version + TLS backend rust-s3 already pulls in
# (native-tls, via its own default "tokio-native-tls" feature) so this adds no
# second TLS stack — it just names the type to reuse rust-s3's own pooled
# `Bucket::http_client()` for a presigned-URL DELETE (see s3.rs).
reqwest = { version = "=0.12.28", default-features = false, features = ["native-tls"] }
age = "0.11.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"

